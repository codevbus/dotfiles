# fuzzel launcher — Catppuccin Mocha. Used by Hyprland (Mod+D) and the
# power menu, and shared with niri.
font=Hack Nerd Font Mono:size=12
prompt="❯ "
terminal=kitty
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
background=1e1e2eee
text=cdd6f4ff
match=f5c2e7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
border=cba6f7ff

[border]
width=2
radius=10
