# SSH agent socket for systemd user services (Emacs daemon, etc.)
#
# Pairs with Arch's shipped `ssh-agent.socket` (ListenStream=%t/ssh-agent.socket
# => $XDG_RUNTIME_DIR/ssh-agent.socket, a stable path). Every user service
# inherits this at manager start, so the Emacs daemon can reach the agent.
#
# NOTE: use ${XDG_RUNTIME_DIR} here, NOT %t — %t is a unit-file specifier and is
# not expanded in environment.d(5).
SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/ssh-agent.socket"
